name: Keepalive

# GitHub tự tắt mọi workflow có lịch (schedule) khi repo 60 ngày không có commit.
# Workflow này tạo 1 commit nhỏ mỗi tháng vào .github/keepalive.txt để repo luôn "có hoạt động",
# giữ cho daily sync không bị tắt (Google Ads đã bị tắt kiểu này từ 10/10/2026).
on:
  schedule:
    - cron: "17 2 1 * *"   # 09:17 giờ VN ngày 1 hằng tháng
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit keepalive
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git commit -m "chore: keepalive (giữ workflow có lịch không bị GitHub tự tắt)" || echo "Không có gì thay đổi"
          git push
