name: Debug Meta Account Access
on:
  workflow_dispatch: # Kích hoạt nút bấm chạy thủ công trên UI GitHub

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install facebook_business

      - name: Run Debug Script
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }} # Ăn theo Secret Token hiện tại của ní
        run: python backfill.py
